[project]
name = "rdkit-dof"
dynamic = ["version"]
description = "RDKit molecule drawing with Depth of Field (DOF) effects."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Miao-Jiong Tang", email = "mj_t@zju.edu.cn" },
]
keywords = ["rdkit", "cheminformatics", "chemistry", "visualization", "molecule", "drawing", "DOF"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.4.0",
    "rdkit>=2023.9.6,<2024.3.6; python_version == '3.8'",
    "rdkit>=2023.9.6; python_version >= '3.9'",
]

[project.urls]
Homepage = "https://github.com/gentle1999/rdkit-dof"
"Bug Tracker" = "https://github.com/gentle1999/rdkit-dof/issues"
Repository = "https://github.com/gentle1999/rdkit-dof.git"

[dependency-groups]
dev = [
    "mypy>=1.14.1,<1.15; python_version == '3.8'",
    "mypy>=1.19.0; python_version >= '3.9'",
    "pyright>=1.1.410",
    "pytest>=8.3.5,<8.4; python_version == '3.8'",
    "pytest>=8.4.2; python_version >= '3.9'",
    "pytest-mock>=3.14.1,<3.15; python_version == '3.8'",
    "pytest-mock>=3.15.1; python_version >= '3.9'",
    "ruff>=0.14.7",
]
notebook = [
    "ipykernel>=6.29.5,<7; python_version == '3.8'",
    "ipykernel>=6.31.0; python_version >= '3.9'",
    "ipywidgets>=8.1.8",
    "nbclient>=0.10.1",
    "nbformat>=5.10.4",
    "notebook>=7.3.3; python_version >= '3.9' or sys_platform != 'win32'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rdkit_dof"]

# =============================================================================
# Mypy Configuration (静态类型检查)
# =============================================================================
[tool.mypy]
python_version = "3.8"
strict = true                # 开启严格模式
warn_return_any = false      # RDKit 经常返回 Any，建议关闭此警告以减少噪音
warn_unused_configs = true
no_site_packages = true      # 避免解析 RDKit wheel 中平台相关的第三方 stub

# 针对 RDKit 的特殊配置
# RDKit 是二进制扩展，Mypy 经常无法找到其类型定义
[[tool.mypy.overrides]]
module = ["rdkit.*", "rdkit.Chem.*", "rdkit.Chem.Draw.*"]
ignore_missing_imports = true

# 针对科学计算/图像库的特殊配置
[[tool.mypy.overrides]]
module = ["numpy", "PIL"]
ignore_missing_imports = true

# 针对 IPython 的特殊配置
[[tool.mypy.overrides]]
module = ["IPython.*"]
ignore_missing_imports = true

# =============================================================================
# Ruff Configuration (Linter & Formatter)
# =============================================================================
[tool.ruff]
# 目标 Python 版本
target-version = "py38"
# 行宽 (符合常见标准，Black 默认为 88)
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.ipynb",
    "pyproject.toml",
]
force-exclude = true

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

# 针对特定文件的豁免
[tool.ruff.lint.per-file-ignores]
# __init__.py 通常会有未使用的导入 (F401)，这是为了暴露 API
"src/rdkit_dof/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# isort (导入排序) 配置
[tool.ruff.lint.isort]
known-first-party = ["rdkit_dof"] # 将本项目识别为第一方库，排序时置于第三方库之后
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.8"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
